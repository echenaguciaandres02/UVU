# Compila UVU en un Mac de GitHub, corre los tests y genera UVU.ipa (sin firmar).
# Sideloadly firma el .ipa con tu Apple ID al instalarlo en el iPhone.
name: Compilar UVU

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Usa el Xcode 26 más nuevo (estable) si el Mac lo tiene: así la app se compila
      # para la misma versión de iOS que tu iPhone (aspecto nativo de iOS 26).
      - name: Elegir Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto Xcode
        run: xcodegen generate

      - name: Compilar .ipa para iPhone
        run: |
          xcodebuild build \
            -project UVU.xcodeproj \
            -scheme UVU \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/UVU.app Payload/
          zip -qry UVU.ipa Payload

      - name: Subir UVU.ipa
        uses: actions/upload-artifact@v4
        with:
          name: UVU-ipa
          path: UVU.ipa
          retention-days: 30

      - name: Tests en el simulador
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.split("iOS")[-1])]
          for runtime in sorted((r for r in devices if ".iOS-" in r), key=version, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"]); sys.exit()
          ')
          echo "Simulador: $UDID"
          STATUS=0
          xcodebuild test \
            -project UVU.xcodeproj \
            -scheme UVU \
            -destination "id=$UDID" \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1 || STATUS=$?
          grep -E "Test Case .*(passed|failed)|Executed [0-9]+ test|error:|\*\* TEST" test.log || true
          if [ $STATUS -ne 0 ]; then
            echo "---- Últimas líneas del registro ----"
            tail -120 test.log
            exit $STATUS
          fi

      - name: Exportar capturas de pantalla
        if: always()
        run: |
          rm -rf Capturas Capturas-raw && mkdir -p Capturas
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path Capturas-raw || true
          python3 - <<'PY'
          import json, os, shutil
          raw, out = "Capturas-raw", "Capturas"
          manifest = os.path.join(raw, "manifest.json")
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for item in test.get("attachments", []):
                      name = (item.get("suggestedHumanReadableName") or item["exportedFileName"]).split("_")[0]
                      if not name.endswith(".png"):
                          name += ".png"
                      shutil.copy(os.path.join(raw, item["exportedFileName"]), os.path.join(out, name))
          print("Capturas:", sorted(os.listdir(out)))
          PY

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Capturas
          path: Capturas
          retention-days: 14
          if-no-files-found: ignore

      - name: Diagnóstico (si fallaron)
        if: failure()
        run: |
          xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact || true
          echo "---- Reportes de cierre inesperado ----"
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/*UVU*.ips 2>/dev/null | head -3); do
            echo "== $f"; head -c 12000 "$f"; echo
          done

      - name: Subir resultados de tests (si fallaron)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: |
            TestResults.xcresult
            test.log
          retention-days: 7
