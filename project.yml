# Definición del proyecto para XcodeGen.
# El archivo UVU.xcodeproj NO se guarda en el repositorio: se genera a partir
# de este archivo con `xcodegen generate` (lo hace la compilación en la nube).
name: UVU

options:
  bundleIdPrefix: com.uvu
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  UVU:
    type: application
    platform: iOS
    sources:
      - path: UVU
    info:
      path: UVU/Resources/Info.plist
      properties:
        CFBundleDisplayName: UVU
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: UVU usa Face ID para proteger tu journal.
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - Anton-Regular.ttf
          - Inter-Regular.ttf
          - Inter-SemiBold.ttf
          - Inter-Black.ttf
          - CormorantGaramond-Regular.otf
          - CormorantGaramond-Medium.otf
          - CormorantGaramond-Italic.otf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uvu.app
        # Los colores del sistema visual se exponen a mano en DesignSystem/Theme.swift.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  UVUTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: UVUTests
    dependencies:
      - target: UVU
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.uvu.app.tests

  # Pruebas de interfaz: abren la app en el simulador y tocan botones como lo harías tú.
  UVUUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UVUUITests
    dependencies:
      - target: UVU
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.uvu.app.uitests
        TEST_TARGET_NAME: UVU

schemes:
  UVU:
    build:
      targets:
        UVU: all
    test:
      targets:
        - UVUTests
        - UVUUITests
